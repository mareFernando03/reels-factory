# Segunda marca de ejemplo (ficticia): una cuenta de divulgación de historia.
# Muestra cómo una marca pisa los tokens del estilo por defecto sin tocar código.

nombre: Historia Breve
instagram: "@historia.breve"
autor: Pablo              # la cara y la voz de la cuenta
rubro: divulgación        # no es un negocio de servicios: no hay clientas ni turnos
especialidad: "Efemérides, historia, deportes, actualidad"
ciudad: Ciudad Demo

colores:
  primario: "#372F2B"
  secundario: "#3F6E9E"
  terciario: "#DCAD8E"
  claro: "#F5EDE0"
  acento: "#F2C230"
  texto: "#FFFFFF"

tipografias:
  titulos: Bebas Neue
  texto: Montserrat

# Dirección de arte (estilo.py, M-23): lo que no figura queda como salon-pop.
# "Archivo": crema y tinta, apenas desaturado y con calidez ocre (sus imágenes son de archivo),
# más grano, sin destellos, y el amarillo con tinta de sus subtítulos como resaltador.
estilo:
  nombre: cultura-archivo
  claro: "#F5EDE0"
  sombra: "28, 22, 18"
  calidez: { color: "#DCAD8E", opacidad: 0.10 }
  destello: "#F2C230"
  destellos: false
  fondo: "#15110E"
  correccion: "contrast(1.06) saturate(0.92) brightness(1.02)"
  vineta: 0.46
  grano: 0.14
  luz: ["255, 236, 200", "242, 194, 48"]
  cierre: ["#FBF7F0", "#F5EDE0", "#E7D9C2"]
  resaltador: "#F2C230"
  resaltador_texto: "#1E1A17"
  subtitulo_fondo: "#F2C230"
  subtitulo_texto: "#1E1A17"
  subtitulo_tipografia: titulo   # Bebas en las cajas amarillas: su firma, sin la sans genérica de las apps (O11)
  titulo: { familia: "Bebas Neue", archivo: bebas-neue-latin-400-normal.woff2, peso: 400, estilo: normal,
            escala: 1.3, mayusculas: true, interletra: 0.01em, respaldo: sans-serif }


logo: assets/logo.png     # no incluido

tono: >-
  Divulgador cercano, en primera persona y de vos. Abre con una pregunta o con
  "Un día como hoy…", cuenta el hecho con datos concretos (fechas, lugares, nombres)
  y cierra con una despedida o una invitación. Sin exclamaciones ni emojis de más.

mensaje:                # salida/para-pablo.txt (fabrica.py): lo publica él desde su teléfono
  para: Pablo
  saludo: ""

cta_por_defecto: "Seguime para más efemérides"

preferencias:
  ritmo: medio

hashtags_base: []

contenido_habitual:
  - efemérides del día (placa o carrusel con imagen de archivo y texto)
  - él a cámara contando una historia
  - reseñas de libros

derechos: >-
  Un reel de la factory se arma con lo que filma el autor, imágenes de dominio público
  o generadas, y música libre de derechos. Material de terceros no se reedita.
